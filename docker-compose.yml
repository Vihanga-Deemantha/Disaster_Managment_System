# Local MongoDB: docker compose up -d mongo, then run scripts/init-mongo.js through mongosh.
# scripts/start-local.ps1 handles startup and initialization without deleting existing data.
# Port 27017 already taken (e.g. a local MongoDB service)?  Run with MONGO_PORT=27018 and set
# MONGODB_URI=mongodb://127.0.0.1:27018/safezone_dev?directConnection=true in backend/.env.
services:
  mongo:
    image: mongo:7
    container_name: safezone-mongo
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - safezone-mongo-data:/data/db

volumes:
  safezone-mongo-data:
